{% extends "base.html" %}

{% block title %}Create New Paste - Text Share{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-4">Create New Paste</h2>
                <form method="POST" id="pasteForm">
                    <div class="mb-3">
                        <input type="text" class="form-control" name="title" placeholder="Title (optional)" maxlength="100">
                    </div>
                    <div class="mb-3 d-flex gap-2">
                        <select class="form-select" name="language">
                            <option value="plaintext">Plain Text</option>
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="java">Java</option>
                            <option value="cpp">C++</option>
                        </select>
                        <select class="form-select" id="modelSelect" style="max-width: 200px;">
                            <option value="google/gemini-exp-1206:free">Gemini</option>
                            <option value="anthropic/claude-3-opus:beta">Claude 3</option>
                            <option value="meta-llama/llama-2-70b-chat">Llama 2</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <div id="editor-toolbar">
                            <select class="ql-size">
                                <option value="small">Small</option>
                                <option selected>Normal</option>
                                <option value="large">Large</option>
                                <option value="huge">Huge</option>
                            </select>
                            <button class="ql-bold"></button>
                            <button class="ql-italic"></button>
                            <button class="ql-underline"></button>
                            <button class="ql-strike"></button>
                            <select class="ql-color"></select>
                            <select class="ql-background"></select>
                            <button class="ql-list" value="ordered"></button>
                            <button class="ql-list" value="bullet"></button>
                            <button class="ql-script" value="sub"></button>
                            <button class="ql-script" value="super"></button>
                            <button class="ql-code-block"></button>
                            <button class="ql-image"></button>
                        </div>
                        <div id="editor" class="form-control"></div>
                        <textarea name="content" id="hiddenContent" style="display: none;"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Create Paste</button>
                        <button type="button" class="btn btn-outline-info" id="analyzeBtn">
                            <i data-feather="activity"></i> Analyze Content
                        </button>
                    </div>
                </form>

                <!-- Analysis Results Modal -->
                <div class="modal fade" id="analysisModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">AI Analysis</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div id="analysisResult" class="p-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
