[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textsharevault"
version = "0.1.0"
description = "A secure text and code sharing platform with AI analysis capabilities"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "openai>=1.65.2",
    "psycopg2-binary>=2.9.10",
    "pymongo>=4.11.2",
]

[project.scripts]
textsharevault = "main:app"
